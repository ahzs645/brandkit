name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Playwright 1.54 supports 24.04; ubuntu-latest now resolves to unsupported 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Select Astryx consumer checks
        id: astryx
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          # The export panel is checked on every build. Install the separate pinned
          # consumer only when its source, inputs or test contract can have changed.
          base_sha="${PR_BASE_SHA:-$PUSH_BEFORE_SHA}"
          if [ "$EVENT_NAME" = workflow_dispatch ] || [ -z "$base_sha" ] || [[ "$base_sha" =~ ^0+$ ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          elif ! git fetch --no-tags --depth=1 origin "$base_sha"; then
            # Missing comparison history must run validation, not skip it.
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            changed_files=$(git diff --name-only "$base_sha" HEAD)
            if printf '%s\n' "$changed_files" | grep -Eq '^(\.github/workflows/pages\.yml$|src/(engine/|fonts/|assets\.js$)|brands/northwind/|library/|examples/astryx/|test/browser/astryx\.check\.mjs$|package(-lock)?\.json$)'; then
              echo 'run=true' >> "$GITHUB_OUTPUT"
            else
              echo 'run=false' >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run setup:printer
      # The engine, pack and manual-pack tests, on the brand brandkit ships (northwind). The brands
      # made with brandkit are tested where they are kept, against this engine.
      - run: npm test
      - run: npm run make:documentation -- --check
      - name: Build the site
        run: npm run build
        env:
          # The repository's own name, so renaming it cannot leave the asset URLs pointing at a
          # path that no longer exists.
          BASE_PATH: /${{ github.event.repository.name }}/
          # The catalogs whose brands the site offers (space-separated): the repository variable
          # BRANDKIT_CATALOGS, or for this repository the brands published with the builds site.
          VITE_BRANDKIT_CATALOGS: ${{ vars.BRANDKIT_CATALOGS || (github.repository == 'ahzs645/brandkit' && 'https://projects.ahmadjalil.com/builds/configs/brandkit/catalog.json' || '') }}
      - name: Install Chromium for the browser check
        # Chromium only: the deploy needs no office suite (LibreOffice took 20 minutes to download
        # from a slow mirror and held the deploy). Never wait on a package's question, and fail in
        # minutes rather than hold the job for hours.
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: npx playwright install --with-deps chromium
      - name: Verify brand packs in the app
        run: npm run test:packs:browser
        env:
          SCREENSHOT_DIR: .documentation/packs-browser
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Verify Astryx export downloads
        run: npm run test:astryx:browser
        env:
          SCREENSHOT_DIR: .documentation/astryx-browser
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Install pinned Astryx consumer
        if: steps.astryx.outputs.run == 'true'
        run: npm ci --prefix examples/astryx
      - name: Verify and build the Astryx consumer
        if: steps.astryx.outputs.run == 'true'
        run: |
          npm --prefix examples/astryx run verify
          npm --prefix examples/astryx run build
      - name: Verify Astryx components in the browser
        if: steps.astryx.outputs.run == 'true'
        run: npm --prefix examples/astryx run test:browser
        env:
          SCREENSHOT_DIR: ${{ github.workspace }}/.documentation/astryx-example
      # Word masters, print previews and editable sources. PDFs need LibreOffice; make them
      # locally with npm run build:documentation -- --pdf.
      - name: Build Word masters for the built-in brand
        run: npm run build:documentation -- --out dist/documentation
      - name: Attach reviewable document starters
        uses: actions/upload-artifact@v4
        with:
          name: brandkit-document-starters
          path: dist/documentation
      - name: Attach browser review captures
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brandkit-browser-checks
          path: |
            .documentation/packs-browser
            .documentation/astryx-browser
            .documentation/astryx-example
          if-no-files-found: ignore
          include-hidden-files: true
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
