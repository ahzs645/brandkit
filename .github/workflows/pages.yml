name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Playwright 1.54 supports 24.04; ubuntu-latest now resolves to unsupported 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run setup:printer
      # The parity test needs the original ddcnorth kit, which is not in the repository, so it
      # skips itself here; the engine and manual-pack tests run.
      - run: npm test
      - run: npm run make:documentation -- --check
      - name: Build the site
        run: npm run build
        env:
          # The repository's own name, so renaming it cannot leave the asset URLs pointing at a
          # path that no longer exists.
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Install document and browser renderers
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer fontconfig poppler-utils
          npx playwright install --with-deps chromium
      - name: Verify native Word pagination
        run: npm run test:documents:pagination
        env:
          REQUIRE_DOCUMENT_RENDERERS: '1'
      - name: Verify the document workflow
        run: npm run test:documents:browser
        env:
          SCREENSHOT_DIR: .documentation/browser
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Build Word masters and matching PDF starters for every brand
        run: npm run build:documentation -- --pdf --out dist/documentation
      - name: Verify UNBC naming and export rules
        run: npm run test:unbc:browser
        env:
          SCREENSHOT_DIR: .documentation/unbc-browser
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Verify the pattern library for every brand
        run: npm run test:patterns:view:browser
        env:
          SCREENSHOT_DIR: .documentation/patterns-browser
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Attach reviewable document starters
        uses: actions/upload-artifact@v4
        with:
          name: brandkit-document-starters
          path: dist/documentation
      - name: Attach browser review captures
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brandkit-browser-checks
          path: |
            .documentation/browser
            .documentation/patterns-browser
            .documentation/unbc-browser
          if-no-files-found: ignore
          include-hidden-files: true
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
