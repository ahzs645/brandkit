<title id="bce-route-outline-title">“the BCE route” locomotive / black outline</title>
<desc id="bce-route-outline-description">Scan-derived vector reconstruction; not original master artwork. Rail letterhead, printed p. 17. The locomotive is retained where recognition of “the BCE route” is required. It is not part of the B.C.Hydro Rail signature and must not be put close to it. Source: BC Hydro Graphic Standards Manual, 1983, PDF page 18 / printed page 17. All lettering is outlined; no font or raster image is required.</desc>
