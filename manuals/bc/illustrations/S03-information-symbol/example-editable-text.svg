<?xml version='1.0' encoding='utf-8'?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="506 446 113 147" width="113" height="147" version="1.1" data-asset="S03-information-symbol" data-revision="signs-r1">
  <ns0:title>Information symbol | editable source-based sign</ns0:title>
  <ns0:desc>Source-derived sign face, supports and separately editable example graphics. Not a current safety-standard or fabrication specification.</ns0:desc>
  <ns0:g id="object" data-layer="object">
    <ns0:g id="posts" data-part="supports">
      <ns0:rect id="S03-information-symbol-open-post-fill-1" data-part="open-post-fill" x="553.0" y="553" width="19" height="34" fill="#fff" stroke="none" stroke-width="0.65"/>
      <ns0:path id="S03-information-symbol-open-post-edges-2" data-part="open-post-edges" d="M553.0 587 V553 M572.0 553 V587" fill="none" stroke="#20221d" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/>
    </ns0:g>
    <ns0:g id="face" data-part="panel">
      <ns0:rect id="S03-information-symbol-sign-board-3" data-part="sign-board" x="512" y="452" width="101" height="101" fill="#6b5b3d" stroke="#20221d" stroke-width="0.85"/>
    </ns0:g>
  </ns0:g>
  <ns0:g id="rules" data-layer="printed-rules">
    <ns0:rect id="S03-information-symbol-symbol-frame-4" data-part="symbol-frame" x="519" y="459" width="87" height="87" fill="none" stroke="white" stroke-width="0.35" rx="13"/>
  </ns0:g>
  <ns0:g id="example-content" data-layer="replaceable-example-content">
    <ns0:circle id="S03-information-symbol-information-ring-5" cx="562.5" cy="502.5" r="28.5" fill="none" stroke="white" stroke-width="7"/>
    <ns0:text id="S03-information-symbol-editable-copy-6" data-part="editable-copy" x="562.5" y="523" font-family="Arimo, Arial, Helvetica, sans-serif" font-size="61" font-weight="700" text-anchor="middle" fill="white" data-font-family="sans" data-bold="true" textLength="32" lengthAdjust="spacingAndGlyphs">?</ns0:text>
  </ns0:g>
  <ns0:g id="example-identity" data-layer="replaceable-example-identity"/>
  <ns0:g id="branding" data-layer="branding" aria-label="Insert your identity artwork here"/>
