<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Template Printer host example</title>
    <style>
      body { margin: 0; padding: 20px; font: 15px/1.5 system-ui, sans-serif; color: #202124; background: #f5f5f5; }
      h1 { margin: 0; font-size: 24px; }
      .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 16px 0; }
      button, input { font: inherit; }
      button { padding: 8px 14px; cursor: pointer; }
      iframe { width: 100%; height: 80vh; min-height: 600px; border: 1px solid #ccc; border-radius: 10px; background: white; }
      #status { min-height: 24px; }
    </style>
  </head>
  <body>
    <h1>Template Printer host example</h1>
    <p>A small host with the full card editor. Open a portable design or start from the OTE staff card.</p>
    <div class="actions">
      <button id="example" type="button">Open OTE staff card</button>
      <label>Open a package <input id="package" type="file" accept=".zip,application/zip" /></label>
      <button id="library" type="button">Open library</button>
    </div>
    <p id="status" role="status"></p>
    <iframe id="printer" title="Template Printer" allow="camera; fullscreen"></iframe>
    <script type="module" src="./main.js"></script>
  </body>
</html>
